name: Validate skills

on:
  push:
    branches: [main]
    paths: ["skills/**"]
  pull_request:
    branches: [main]
    paths: ["skills/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        run: bash scripts/validate-skills.sh
